[project]
name = "payment-processing-service"
version = "0.1.0"
description = ""
authors = [
    {name = "maksim",email = "knyazev.maksim2852@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "fastapi[all] (>=0.135.2,<0.136.0)",
    "dishka (>=1.9.1,<2.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "sqlalchemy[asyncio] (>=2.0.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "faststream[rabbit] (>=0.6.7,<0.7.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "httpx (>=0.27.0,<1.0.0)",
]


[dependency-groups]
dev = [
    "ruff (>=0.15.8,<0.16.0)",
    "pyright (>=1.1.408,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
target-version = "py312"
line-length = 88


[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC"]
ignore = []


[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.pyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__", ".venv"]
typeCheckingMode = "standard"
