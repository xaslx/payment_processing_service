services:
  app:
    build: .
    container_name: payment_app
    restart: always
    ports:
      - "8000:8000"
    env_file: .env
    command: uvicorn src.main:create_app --factory --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - payment_net

  postgres:
    image: postgres:16-alpine
    container_name: payment_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-payment_service}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-payment_service}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payment_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: payment_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - payment_net
    # profiles:
    #   - dev

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: payment_rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payment_net

  payment_worker:
    build: .
    container_name: payment_worker
    restart: always
    command: faststream run src.worker.setup:app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - payment_net

networks:
  payment_net:
    driver: bridge
